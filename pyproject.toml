[project]
name = "primus"
version = "0.1.0"
description = "PRIMUS V1 — AI Physics Tutor"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "google-genai>=1.0.0",
    "imageio-ffmpeg>=0.5.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "websockets>=13.0",
    "edge-tts>=6.1.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.27.0",
]

[project.scripts]
primus = "primus.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
